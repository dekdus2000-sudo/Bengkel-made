name: Build Bengkel Made APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract source
        run: unzip -q Bengkel-Made-Android-source.zip -d build-source
      - name: Build APK
        run: gradle -p build-source/bengkel-made-android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Bengkel-Made-APK
          path: build-source/bengkel-made-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
